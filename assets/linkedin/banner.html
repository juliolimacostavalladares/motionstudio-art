<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1584px;
    height: 396px;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .banner {
    width: 1584px;
    height: 396px;
    background: #111111;
    position: relative;
    display: flex;
    align-items: center;
  }

  .mesh-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 50%, rgba(212, 225, 87, 0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 80% at 20% 80%, rgba(212, 225, 87, 0.06) 0%, transparent 50%);
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(212, 225, 87, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212, 225, 87, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .shape-1 {
    position: absolute;
    right: 120px;
    top: 50%;
    transform: translateY(-50%);
    width: 260px;
    height: 260px;
    border: 2px solid rgba(212, 225, 87, 0.15);
    border-radius: 50%;
  }

  .shape-2 {
    position: absolute;
    right: 180px;
    top: 50%;
    transform: translateY(-50%);
    width: 180px;
    height: 180px;
    border: 2px solid rgba(212, 225, 87, 0.1);
    border-radius: 50%;
  }

  .shape-3 {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    width: 340px;
    height: 340px;
    border: 1px solid rgba(212, 225, 87, 0.06);
    border-radius: 50%;
  }

  .accent-line {
    position: absolute;
    left: 0;
    top: 0;
    width: 6px;
    height: 100%;
    background: linear-gradient(180deg, #d4e157 0%, rgba(212, 225, 87, 0.3) 100%);
  }

  .content {
    position: relative;
    z-index: 10;
    padding-left: 100px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #d4e157;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  .tag::before {
    content: '';
    width: 24px;
    height: 2px;
    background: #d4e157;
  }

  .headline {
    font-size: 52px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1.5px;
    line-height: 1.1;
  }

  .headline .highlight {
    color: #d4e157;
  }

  .slogan {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .dots {
    position: absolute;
    right: 400px;
    top: 50%;
    transform: translateY(-50%);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }

  .dot {
    width: 4px;
    height: 4px;
    background: rgba(212, 225, 87, 0.2);
    border-radius: 50%;
  }

  .logo-area {
    position: absolute;
    right: 100px;
    bottom: 40px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-mark {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }

  .logo-mark svg {
    width: 100%;
    height: 100%;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="mesh-bg"></div>
    <div class="grid-overlay"></div>
    <div class="accent-line"></div>

    <div class="shape-1"></div>
    <div class="shape-2"></div>
    <div class="shape-3"></div>

    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="content">
      <div class="tag">Software House</div>
      <h1 class="headline">
        Mova o seu<br><span class="highlight">negócio</span>
      </h1>
      <p class="slogan">Movimente o seu negócio com tecnologia sob medida</p>
    </div>

    <div class="logo-area">
      <div class="logo-mark">
        <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <rect width="200" height="200" rx="40" fill="#111111"/>
          <path d="M100 40C66.86 40 40 66.86 40 100C40 133.14 66.86 160 100 160H160V100C160 66.86 133.14 40 100 40Z" fill="#d4e157"/>
          <circle cx="100" cy="100" r="25" fill="#111111"/>
        </svg>
      </div>
      <span class="logo-text">MotionStudio</span>
    </div>
  </div>
</body>
</html>
